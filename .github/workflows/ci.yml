name: CI

on:
  push:
  pull_request:

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala o uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instala as dependências
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes (pytest)
        run: uv run pytest
